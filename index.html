<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Pflanzenkatalog</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600;9..144,700&family=Poppins:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    /* Mid-Century-Palette in gedeckten Tönen: warmes Oatmeal, gebranntes Terrakotta,
       gedämpftes Petrol/Teal, Senfgelb — statt der vorherigen frischen Moos/Ton-Töne. */
    --paper:#E9E0CB;
    --paper-2:#DDD0AC;
    --ink:#33291F;
    --ink-soft:#7A6952;
    --moss:#3E6B69;
    --moss-light:#74A39D;
    --moss-pale:#D9E6E1;
    --clay:#BC5B3B;
    --clay-pale:#EFD7C3;
    --gold:#C6963A;
    --line:#CBB88F;
    --white:#FBF5E8;
    --danger:#A8452F;
  }
  *{box-sizing:border-box;}
  body{
    margin:0;
    background:var(--paper);
    color:var(--ink);
    font-family:'Poppins',sans-serif;
    -webkit-font-smoothing:antialiased;
  }
  h1,h2,h3,.serif{font-family:'Fraunces',serif;}
  .app{max-width:960px;margin:0 auto;padding:2.5rem 1.5rem 5rem;}

  .top{display:flex;align-items:baseline;justify-content:space-between;gap:1rem;margin-bottom:0.25rem;flex-wrap:wrap;}
  .top h1{font-size:32px;font-weight:600;margin:0;color:var(--ink);letter-spacing:-0.01em;}
  .top .count{font-size:13px;color:var(--ink-soft);}
  .sub{color:var(--ink-soft);font-size:14px;margin:0 0 1.75rem;max-width:520px;line-height:1.5;}

  .tabs{display:flex;gap:8px;border-bottom:2px solid var(--line);margin-bottom:1.5rem;padding-bottom:10px;flex-wrap:wrap;}
  .tab{
    padding:9px 16px;margin-right:0;background:var(--white);border:1.5px solid var(--line);border-radius:8px;cursor:pointer;
    font-family:'Poppins',sans-serif;font-size:14px;font-weight:500;color:var(--ink-soft);
    transition:background .15s ease, color .15s ease, border-color .15s ease;
  }
  .tab:hover{border-color:var(--moss-light);color:var(--moss);}
  .tab.active{background:var(--moss);color:var(--white);border-color:var(--moss);}
  .tab .n{color:inherit;font-weight:400;margin-left:4px;opacity:0.8;}

  .toolbar{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-bottom:1.25rem;flex-wrap:wrap;}
  .search{
    flex:1;min-width:180px;background:var(--white);border:1.5px solid var(--line);border-radius:7px;
    padding:9px 12px;font-size:14px;color:var(--ink);font-family:'Poppins',sans-serif;
  }
  .search:focus{outline:none;border-color:var(--moss);}
  .btn{
    display:inline-flex;align-items:center;gap:6px;background:var(--moss);color:var(--white);
    border:1.5px solid var(--ink);border-radius:7px;padding:9px 16px;font-size:14px;font-weight:500;cursor:pointer;
    font-family:'Poppins',sans-serif;white-space:nowrap;
    box-shadow:3px 3px 0 var(--ink);transition:transform .1s ease, box-shadow .1s ease, background .15s ease;
  }
  .btn:hover{background:#2E5654;transform:translate(-1px,-1px);box-shadow:4px 4px 0 var(--ink);}
  .btn:active{transform:translate(1px,1px);box-shadow:1px 1px 0 var(--ink);}
  .btn.ghost{background:var(--white);color:var(--moss);border:1.5px solid var(--moss-light);box-shadow:2px 2px 0 var(--line);}
  .btn.ghost:hover{background:var(--moss-pale);transform:translate(-1px,-1px);box-shadow:3px 3px 0 var(--line);}
  .btn.ghost:active{transform:translate(1px,1px);box-shadow:1px 1px 0 var(--line);}
  .btn.danger{background:var(--white);color:var(--danger);border:1.5px solid #DCB6A8;box-shadow:2px 2px 0 #DCB6A8;}
  .btn.danger:hover{background:#F6E6DD;transform:translate(-1px,-1px);box-shadow:3px 3px 0 #DCB6A8;}
  .btn.danger:active{transform:translate(1px,1px);box-shadow:1px 1px 0 #DCB6A8;}

  .toolbar-controls{margin-top:-6px;}
  .control-group{display:flex;gap:8px;flex-wrap:wrap;flex:1;}
  .control-select{
    background:var(--white);border:1.5px solid var(--line);border-radius:7px;
    padding:7px 10px;font-size:13px;color:var(--ink);font-family:'Poppins',sans-serif;cursor:pointer;
  }
  .control-select:focus{outline:none;border-color:var(--moss);}
  .view-toggle{display:flex;border:1.5px solid var(--ink);border-radius:7px;overflow:hidden;flex-shrink:0;}
  .view-btn{
    background:var(--white);border:none;padding:7px 12px;font-size:15px;cursor:pointer;color:var(--ink-soft);
    border-left:1.5px solid var(--ink);
  }
  .view-btn:first-child{border-left:none;}
  .view-btn.active{background:var(--moss-pale);color:var(--moss);}

  .list-row{
    display:flex;align-items:center;gap:14px;background:var(--white);border:1.5px solid var(--ink);
    border-radius:8px;padding:11px 16px;cursor:pointer;
    transition:transform .1s ease, box-shadow .1s ease;box-shadow:3px 3px 0 var(--line);
  }
  .list-row:hover{transform:translate(-2px,-2px);box-shadow:5px 5px 0 var(--moss-light);}
  .list-row + .list-row{margin-top:8px;}
  .list-row .name{font-size:15px;font-weight:500;margin:0;flex:1;min-width:120px;}
  .list-row .latin{font-style:italic;color:var(--ink-soft);font-size:12.5px;flex:1;min-width:100px;}
  .list-row .list-meta{display:flex;align-items:center;gap:10px;font-size:12.5px;color:var(--ink-soft);flex-wrap:wrap;justify-content:flex-end;}

  .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:14px;}

  .card{
    background:var(--white);border:1.5px solid var(--ink);border-radius:10px;padding:16px 18px;
    cursor:pointer;transition:transform .1s ease, box-shadow .1s ease;
    position:relative;box-shadow:4px 4px 0 var(--line);
  }
  .card:hover{transform:translate(-2px,-2px);box-shadow:6px 6px 0 var(--moss-light);}
  .card .name{font-size:17px;font-weight:500;margin:0 0 2px;color:var(--ink);}
  .card .latin{font-style:italic;color:var(--ink-soft);font-size:13px;margin:0 0 12px;}
  .badge{
    display:inline-block;font-size:10.5px;font-weight:600;padding:3px 8px;border-radius:4px;
    background:var(--moss-pale);color:var(--moss);margin-right:6px;border:1px solid transparent;
    text-transform:uppercase;letter-spacing:0.03em;
  }
  .badge.clay{background:var(--clay-pale);color:var(--clay);}
  .badge.gold{background:#F3E9D8;color:var(--gold);}
  .badge.muted{background:var(--paper-2);color:var(--ink-soft);}
  .badge.success{background:var(--moss);color:var(--white);}
  .meta-row{display:flex;justify-content:space-between;font-size:12.5px;color:var(--ink-soft);margin-top:12px;padding-top:10px;border-top:1.5px solid var(--line);}
  .status-dot{display:inline-block;width:8px;height:8px;border-radius:2px;margin-right:5px;position:relative;top:-1px;}

  .empty{
    text-align:center;padding:4rem 1rem;color:var(--ink-soft);
  }
  .empty .empty-icon{font-size:38px;line-height:1;margin-bottom:12px;opacity:0.55;}
  .empty .serif{font-size:20px;color:var(--moss);margin-bottom:6px;}

  /* Modal */
  .overlay{
    position:fixed;inset:0;background:rgba(51,41,31,0.4);display:none;
    align-items:flex-start;justify-content:center;padding:4vh 16px;overflow-y:auto;z-index:50;
  }
  .overlay.show{display:flex;}
  .modal{
    background:var(--paper);border-radius:12px;max-width:520px;width:100%;border:2px solid var(--ink);
    padding:1.75rem 1.75rem 1.5rem;box-shadow:8px 8px 0 var(--clay);margin-top:2vh;
  }
  .modal h2{margin:0 0 4px;font-size:22px;font-weight:600;color:var(--ink);}
  .modal .modal-sub{font-size:13px;color:var(--ink-soft);margin:0 0 20px;}
  .field{margin-bottom:14px;}
  .field label{display:block;font-size:12.5px;font-weight:500;color:var(--ink-soft);margin-bottom:5px;}
  .field input, .field select, .field textarea{
    width:100%;padding:9px 11px;border:1.5px solid var(--line);border-radius:6px;
    font-family:'Poppins',sans-serif;font-size:14px;background:var(--white);color:var(--ink);
  }
  .field input:focus, .field select:focus, .field textarea:focus{outline:none;border-color:var(--moss);}
  .field textarea{resize:vertical;min-height:60px;}
  .row2{display:grid;grid-template-columns:1fr 1fr;gap:12px;}
  .toggle-group{display:flex;gap:8px;}
  .toggle-opt{
    flex:1;text-align:center;padding:9px;border:1.5px solid var(--line);border-radius:6px;
    cursor:pointer;font-size:13.5px;color:var(--ink-soft);font-weight:500;background:var(--white);
    transition:transform .1s ease;
  }
  .toggle-opt.active{background:var(--moss);color:var(--white);border-color:var(--moss);}
  .toggle-opt.active.clay{background:var(--clay);border-color:var(--clay);}
  .modal-actions{display:flex;justify-content:space-between;align-items:center;margin-top:22px;}
  .err{color:var(--danger);font-size:12.5px;margin-top:4px;display:none;}
  .err.show{display:block;}
  .hint{font-size:12px;color:var(--ink-soft);margin-top:14px;padding:10px 12px;background:var(--moss-pale);border-radius:8px;}

  .daily-banner{
    display:flex;align-items:flex-start;gap:12px;background:var(--clay-pale);border:1.5px solid #D9B48F;
    border-radius:10px;padding:14px 16px;margin-bottom:1.5rem;
  }
  .daily-banner .icon{color:var(--clay);font-size:20px;line-height:1;margin-top:1px;}
  .daily-banner .title{font-weight:500;color:var(--clay);font-size:14px;margin:0 0 4px;}
  .daily-banner .items{display:flex;flex-wrap:wrap;gap:6px;}
  .daily-chip{
    background:var(--white);border:1px solid #D9B48F;color:var(--clay);font-size:12.5px;
    padding:4px 10px;border-radius:20px;cursor:pointer;font-weight:500;
  }
  .daily-chip:hover{background:var(--clay-pale);}

  .storage-warning{
    display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;
    background:#F6E6DD;border:1.5px solid #DCB6A8;border-radius:10px;padding:12px 16px;margin-bottom:1.5rem;
  }
  .storage-warning p{margin:0;font-size:13px;color:var(--danger);}
  .storage-warning p strong{font-weight:600;}

  .fert-section{border-top:1px solid var(--line);margin-top:18px;padding-top:16px;}
  .fert-heading{display:block;font-size:14px;font-weight:600;color:var(--moss);margin-bottom:8px;}
  .fert-log{margin:10px 0;display:flex;flex-direction:column;gap:6px;max-height:140px;overflow-y:auto;}
  .fert-log-entry{
    display:flex;gap:10px;align-items:baseline;font-size:12.5px;color:var(--ink-soft);
    background:var(--white);border:1.5px solid var(--line);border-radius:6px;padding:6px 10px;
  }
  .fert-log-date{font-weight:600;color:var(--ink);white-space:nowrap;}
  .fert-log-product{color:var(--clay);white-space:nowrap;}
  .fert-log-note{flex:1;font-style:italic;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
  .log-delete-btn{
    flex-shrink:0;margin-left:auto;background:none;border:none;color:var(--ink-soft);
    font-size:15px;line-height:1;cursor:pointer;padding:2px 4px;border-radius:4px;
  }
  .log-delete-btn:hover{background:var(--clay-pale);color:var(--danger);}
  .fert-add-row{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:4px;}
  @media (max-width:520px){
    .fert-add-row{grid-template-columns:1fr;}
  }

  .link-badge{background:var(--paper-2);color:var(--ink-soft);cursor:pointer;text-transform:none;letter-spacing:normal;font-weight:500;}
  .link-badge:hover{background:var(--moss-pale);color:var(--moss);}

  /* Mehrfachauswahl */
  .select-check{
    position:absolute;top:10px;right:10px;width:22px;height:22px;border-radius:4px;
    border:2px solid var(--ink);background:var(--white);cursor:pointer;z-index:2;
    padding:0;display:flex;align-items:center;justify-content:center;font-family:inherit;
  }
  .select-check:focus-visible{outline:2px solid var(--moss);outline-offset:2px;}
  .select-check.checked{background:var(--moss);border-color:var(--moss);}
  .select-check.checked::after{content:'✓';color:var(--white);font-size:13px;line-height:1;}
  .list-row.selectable{position:relative;padding-left:44px;}
  .list-row .select-check{left:12px;right:auto;top:50%;transform:translateY(-50%);}
  .card.selectable{padding-top:34px;}
  .bulk-bar{
    display:none;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;
    background:var(--moss-pale);border:1.5px solid var(--moss);border-radius:8px;
    padding:10px 14px;margin-bottom:1.25rem;
  }
  .bulk-bar.show{display:flex;}
  .bulk-bar .bulk-count{font-size:13.5px;font-weight:500;color:var(--moss);}
  .bulk-bar .bulk-actions{display:flex;gap:8px;flex-wrap:wrap;}

  @media (max-width:520px){
    .row2{grid-template-columns:1fr;}
    .top h1{font-size:26px;}
  }
</style>
</head>
<body>
<div class="app">
  <h2 class="sr-only" style="position:absolute;width:1px;height:1px;overflow:hidden;">Pflanzenkatalog: verwalte deine Pflanzen und deren Ableger und Stecklinge, mit Herkunftsverfolgung.</h2>

  <div class="top">
    <h1>🪴 Pflanzenkatalog</h1>
    <span class="count" id="headerCount"></span>
  </div>
  <p class="sub">Deine Pflanzensammlung und alle Ableger, Stecklinge und Sämlinge an einem Ort. <span id="syncStatus" style="font-size:12px;font-weight:500;"></span></p>

  <div id="storageWarning"></div>
  <div id="dailyOverview"></div>

  <div class="tabs">
    <button class="tab active" data-tab="plants" onclick="setTab('plants')">🌱 Pflanzen <span class="n" id="tabCountPlants"></span></button>
    <button class="tab" data-tab="cuttings" onclick="setTab('cuttings')">🌿 Ableger &amp; Stecklinge <span class="n" id="tabCountCuttings"></span></button>
    <button class="tab" data-tab="wishlist" onclick="setTab('wishlist')">⭐ Wunschliste <span class="n" id="tabCountWishlist"></span></button>
  </div>

  <div class="toolbar">
    <input class="search" id="searchInput" placeholder="Suchen…" oninput="render()">
    <button class="btn ghost" id="selectModeBtn" onclick="toggleSelectionMode()">Auswählen</button>
    <button class="btn ghost" id="exportBtn" onclick="exportData()">Exportieren</button>
    <button class="btn ghost" id="importBtn" onclick="document.getElementById('importFileInput').click()">Importieren</button>
    <input type="file" id="importFileInput" accept="application/json" style="display:none;" onchange="importDataFromFile(this)">
    <button class="btn" id="addBtn" onclick="openModal()">+ Neu</button>
  </div>

  <div class="bulk-bar" id="bulkBar">
    <span class="bulk-count" id="bulkCount">0 ausgewählt</span>
    <div class="bulk-actions">
      <button class="btn ghost" id="bulkFertBtn" onclick="bulkMarkFertilized()">Als gedüngt markieren</button>
      <button class="btn ghost" id="bulkWaterBtn" onclick="bulkMarkWatered()">Als gegossen markieren</button>
      <button class="btn ghost" id="bulkFlushBtn" onclick="bulkMarkFlushed()">Als durchgespült markieren</button>
      <button class="btn ghost" id="bulkPurchasedBtn" style="display:none;" onclick="bulkMarkPurchased()">Als gekauft markieren</button>
      <button class="btn ghost" onclick="clearSelection()">Auswahl aufheben</button>
    </div>
  </div>

  <div class="toolbar toolbar-controls">
    <div class="control-group">
      <select class="control-select" id="filterStatus" onchange="render()">
        <option value="">Alle Zustände</option>
        <option value="sehr gut">sehr gut</option>
        <option value="gut">gut</option>
        <option value="mittel">mittel</option>
        <option value="schlecht">schlecht</option>
        <option value="krank">krank</option>
        <option value="wurzelt">wurzelt</option>
      </select>
      <select class="control-select" id="filterCategory" onchange="render()">
        <option value="">Alle Kategorien</option>
      </select>
      <select class="control-select" id="filterOrigin" onchange="render()" style="display:none;">
        <option value="">Eigene &amp; Fremde</option>
        <option value="eigene">Nur eigene</option>
        <option value="fremd">Nur fremde</option>
      </select>
      <select class="control-select" id="filterPriority" onchange="render()" style="display:none;">
        <option value="">Alle Prioritäten</option>
        <option value="Muss ich haben">Muss ich haben</option>
        <option value="Sehr interessant">Sehr interessant</option>
        <option value="Klingt interessant">Klingt interessant</option>
        <option value="Irgendwann mal">Irgendwann mal</option>
        <option value="Gekauft">Gekauft</option>
      </select>
      <select class="control-select" id="sortBy" onchange="render()">
        <option value="name-asc">Name A–Z</option>
        <option value="name-desc">Name Z–A</option>
        <option value="status">Zustand</option>
        <option value="location">Standort</option>
      </select>
    </div>
    <div class="view-toggle">
      <button class="view-btn active" id="viewGridBtn" onclick="setView('grid')" title="Kachelansicht">▦</button>
      <button class="view-btn" id="viewListBtn" onclick="setView('list')" title="Listenansicht">☰</button>
    </div>
  </div>

  <div id="content"></div>
</div>

<div class="overlay" id="overlay">
  <div class="modal" id="modalBox"></div>
</div>

<div class="overlay" id="confirmOverlay">
  <div class="modal" id="confirmBox" style="max-width:380px;">
    <h2 id="confirmTitle" style="color:var(--danger);">Wirklich löschen?</h2>
    <p class="modal-sub" id="confirmMessage"></p>
    <div class="modal-actions" style="justify-content:flex-end;">
      <div style="display:flex;gap:8px;">
        <button class="btn ghost" onclick="closeConfirm()">Abbrechen</button>
        <button class="btn danger" style="background:var(--danger);color:var(--white);border:none;" id="confirmDeleteBtn" onclick="runPendingDelete()">Löschen</button>
      </div>
    </div>
  </div>
</div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/12.19.0/firebase-app.js";
import { getAuth, signInAnonymously, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/12.19.0/firebase-auth.js";
import { getFirestore, doc, getDoc, setDoc, onSnapshot } from "https://www.gstatic.com/firebasejs/12.19.0/firebase-firestore.js";

const firebaseConfig = {
  apiKey: "AIzaSyCBd3P1hIWbVq1dZAf7pkdJsjIeCDOyOYM",
  authDomain: "pflanzenkatalog.firebaseapp.com",
  projectId: "pflanzenkatalog",
  storageBucket: "pflanzenkatalog.firebasestorage.app",
  messagingSenderId: "28333160433",
  appId: "1:28333160433:web:d19585d008ce91f603f650"
};

const fbApp = initializeApp(firebaseConfig);
const auth = getAuth(fbApp);
const db = getFirestore(fbApp);

let currentUid = null;
let docRef = null;
let unsubscribeSnapshot = null;
let isRemoteUpdate = false;
let saveTimer = null;
let state = { plants: [], cuttings: [], wishlist: [] };
let currentTab = 'plants';
let currentView = 'grid';
let editingId = null;
let selectionMode = false;
let selectedIds = new Set();
let filterParentType = null; // 'plant' | 'cutting' — gesetzt, wenn von "X Ableger" geklickt wird
let filterParentId = null;
let convertingWishlistId = null; // gesetzt während der Übernahme eines Wunsches in den Pflanzenkatalog

const WISHLIST_PRIORITIES = ['Muss ich haben', 'Sehr interessant', 'Klingt interessant', 'Irgendwann mal', 'Gekauft'];

// Artbezogene Referenzdatenbank gängiger und seltener Zimmerpflanzen.
// Wird für Autovervollständigung genutzt — manuelle Eingabe bleibt jederzeit möglich.
const PLANT_DB = [
  {name:'Monstera Deliciosa', latin:'Monstera deliciosa', category:'Aroid'},
  {name:'Monstera Adansonii', latin:'Monstera adansonii', category:'Aroid'},
  {name:'Monstera Thai Constellation', latin:'Monstera deliciosa var. borsigiana', category:'Aroid'},
  {name:'Efeutute', latin:'Epipremnum aureum', category:'Aroid'},
  {name:'Philodendron Scandens', latin:'Philodendron hederaceum', category:'Aroid'},
  {name:'Philodendron Birkin', latin:'Philodendron Birkin', category:'Aroid'},
  {name:'Philodendron Pink Princess', latin:'Philodendron erubescens', category:'Aroid'},
  {name:'Philodendron Micans', latin:'Philodendron hederaceum var. micans', category:'Aroid'},
  {name:'Fensterblatt', latin:'Monstera deliciosa', category:'Aroid'},
  {name:'Anthurium', latin:'Anthurium andraeanum', category:'Aroid'},
  {name:'Anthurium Crystallinum', latin:'Anthurium crystallinum', category:'Aroid (selten)'},
  {name:'Anthurium Warocqueanum', latin:'Anthurium warocqueanum', category:'Aroid (selten)'},
  {name:'Alocasia Amazonica', latin:'Alocasia x amazonica', category:'Aroid'},
  {name:'Alocasia Zebrina', latin:'Alocasia zebrina', category:'Aroid'},
  {name:'Alocasia Frydek', latin:'Alocasia micholitziana', category:'Aroid (selten)'},
  {name:'Caladium', latin:'Caladium bicolor', category:'Aroid'},
  {name:'Zimmercalla', latin:'Zantedeschia aethiopica', category:'Aroid'},
  {name:'Einblatt', latin:'Spathiphyllum wallisii', category:'Aroid'},

function getFertilizerTip(speciesName){
  const match = findPlantInDB(speciesName);
  if(match && FERTILIZER_TIPS[match.category]) return FERTILIZER_TIPS[match.category];
  return FERTILIZER_FALLBACK_TIP;
}

function getFertilizerInfo(item){
  const log = item.fertilizerLog || [];
  const interval = Number(item.fertilizerIntervalDays) || 0;
  if(log.length===0 || !interval) return null;
  const sorted = [...log].sort((a,b)=> a.date < b.date ? 1 : -1);
  const last = sorted[0];
  const lastDate = new Date(last.date + 'T00:00:00');
  const nextDue = new Date(lastDate.getTime() + interval*24*60*60*1000);
  const today = new Date(new Date().toDateString());
  const daysLeft = Math.round((nextDue.getTime() - today.getTime()) / (24*60*60*1000));
  return { lastDate, nextDue, daysLeft, overdue: daysLeft <= 0, lastEntry: last };
}

function fertilizerBadge(item){
  const info = getFertilizerInfo(item);
  if(!info) return '';
  if(info.overdue){
    return `<span class="badge" style="background:var(--clay-pale);color:var(--clay);">Düngen fällig</span>`;
  }
  return `<span class="badge" style="background:var(--moss-pale);color:var(--moss);">Düngen in ${info.daysLeft} Tag${info.daysLeft===1?'':'en'}</span>`;
}

// Protokoll-Verlauf für Düngen/Gießen/Durchspülen — die drei Log-Arten unterscheiden
// sich nur darin, ob es ein Sekundär-Label (Produkt bzw. Gieß-Art) gibt und in der
// Leer-Meldung. Fertilizer/Watering rendern das Sekundär-Label-Feld immer (auch wenn
// leer), Flush hat gar keins — das entspricht exakt dem bisherigen Verhalten.
const LOG_EMPTY_MESSAGE = {
  fertilizerLog: 'Noch keine Düngung erfasst.',
  wateringLog: 'Noch keine Gießung erfasst.',
  flushLog: 'Noch kein Durchspülen erfasst.',
};
const LOG_HAS_SECONDARY_LABEL = { fertilizerLog: true, wateringLog: true, flushLog: false };

function logSecondaryLabel(fieldName, entry){
  if(fieldName==='fertilizerLog') return entry.product||'';
  if(fieldName==='wateringLog') return entry.type||'';
  return '';
}

function logHistoryHtml(log, type, itemId, prefix, fieldName){
  if(!log || log.length===0){
    return `<div class="hint" style="background:transparent;border:1px dashed var(--line);color:var(--ink-soft);">${LOG_EMPTY_MESSAGE[fieldName]}</div>`;
  }
  const withIndex = log.map((e, idx)=>({...e, __idx: idx}));
  const sorted = withIndex.sort((a,b)=> a.date < b.date ? 1 : -1);
  return `<div class="fert-log">${sorted.map(e=>`
    <div class="fert-log-entry">
      <span class="fert-log-date">${escapeHtml(e.date)}</span>
      ${LOG_HAS_SECONDARY_LABEL[fieldName] ? `<span class="fert-log-product">${escapeHtml(logSecondaryLabel(fieldName, e))}</span>` : ''}
      ${e.note ? `<span class="fert-log-note">${escapeHtml(e.note)}</span>` : ''}
      <button type="button" class="log-delete-btn" title="Eintrag löschen" onclick="deleteLogEntry('${type}', ${itemId}, '${fieldName}', ${e.__idx}, '${prefix}')">✕</button>
    </div>`).join('')}</div>`;
}

function getRefillInfo(item){
  if(!isSemiHydro(item.substrate) || !item.reservoirEmpty || !item.reservoirEmptySince){
    return null;
  }
  const emptySince = new Date(item.reservoirEmptySince + 'T00:00:00');
  const dryDays = Number(item.dryDays) || 0;
  const refillDate = new Date(emptySince.getTime() + dryDays*24*60*60*1000);
  const today = new Date(new Date().toDateString());
  const msLeft = refillDate.getTime() - today.getTime();
  const daysLeft = Math.round(msLeft / (24*60*60*1000));
  return { refillDate, daysLeft, overdue: daysLeft <= 0 };
}

function refillBadge(item){
  const info = getRefillInfo(item);
  if(!info) return '';
  if(info.overdue){
    return `<span class="badge" style="background:var(--clay-pale);color:var(--clay);">Reservoir auffüllen</span>`;
  }
  return `<span class="badge" style="background:var(--moss-pale);color:var(--moss);">Auffüllen in ${info.daysLeft} Tag${info.daysLeft===1?'':'en'}</span>`;
}

function normalizeState(s){
  if(!s.wishlist) s.wishlist = [];
  return s;
}

function setSyncStatus(text, ok){
  const el = document.getElementById('syncStatus');
  if(el){
    el.textContent = text;
    el.style.color = ok ? 'var(--moss-light)' : 'var(--danger)';
  }
}

async function initFirebase(){
  return new Promise((resolve)=>{
    onAuthStateChanged(auth, async (user)=>{
      if(user){
        currentUid = user.uid;
        docRef = doc(db, 'users', currentUid, 'catalog', 'data');
        await attachRealtimeSync();
        resolve();
      }
    });
    signInAnonymously(auth).catch((err)=>{
      console.error('Anmeldung fehlgeschlagen', err);
      setSyncStatus('Offline (Anmeldung fehlgeschlagen)', false);
      state = defaultState();
      resolve();
    });
  });
}

async function attachRealtimeSync(){
  try{
    const snap = await getDoc(docRef);
    if(snap.exists()){
      state = normalizeState(snap.data());
    } else {
      state = defaultState();
      await setDoc(docRef, state);
    }
  }catch(e){
    console.error('Erstladen fehlgeschlagen', e);
    state = defaultState();
    setSyncStatus('Offline — lokale Daten', false);
  }

  if(unsubscribeSnapshot) unsubscribeSnapshot();
  unsubscribeSnapshot = onSnapshot(docRef, (snap)=>{
    if(snap.exists()){
      isRemoteUpdate = true;
      state = normalizeState(snap.data());
      render();
      isRemoteUpdate = false;
    }
    setSyncStatus('Synchronisiert', true);
  }, (err)=>{
    console.error('Sync-Fehler', err);
    setSyncStatus('Offline — lokale Daten', false);
  });
}

async function saveState(){
  if(isRemoteUpdate) return;
  if(!docRef){ return; }
  clearTimeout(saveTimer);
  return new Promise((resolve)=>{
    saveTimer = setTimeout(async ()=>{
      try{
        await setDoc(docRef, state);
        setSyncStatus('Synchronisiert', true);
      }catch(e){
        console.error('Speichern fehlgeschlagen', e);
        setSyncStatus('Offline — Änderung nicht gespeichert', false);
      }
      resolve();
    }, 300);
  });
}

/* ---------- Import ---------- */

function importDataFromFile(inputEl){
  const file = inputEl.files && inputEl.files[0];
  if(!file) return;
  const reader = new FileReader();
  reader.onload = (e)=>{
    let parsed;
    try{
      parsed = JSON.parse(e.target.result);
    }catch(err){
      alert('Diese Datei ist kein gültiges JSON. Import abgebrochen.');
      inputEl.value = '';
      return;
    }
    if(!parsed || !Array.isArray(parsed.plants) || !Array.isArray(parsed.cuttings)){
      alert('Diese Datei hat nicht das erwartete Format (Felder "plants" und "cuttings" fehlen). Import abgebrochen.');
      inputEl.value = '';
      return;
    }
    // "wishlist" gibt es erst seit dieser Funktion — ältere Backups haben das Feld
    // noch nicht, deshalb hier optional statt Pflicht-Validierung.
    const importedWishlist = Array.isArray(parsed.wishlist) ? parsed.wishlist : [];
    showConfirm(
      `Vor dem Import wird automatisch eine Sicherheitskopie deines aktuellen Bestands heruntergeladen. Danach wird er ersetzt: ${state.plants.length} Pflanzen, ${state.cuttings.length} Ableger/Stecklinge, ${state.wishlist.length} Wunschlisten-Einträge → ${parsed.plants.length} Pflanzen, ${parsed.cuttings.length} Ableger/Stecklinge, ${importedWishlist.length} Wunschlisten-Einträge aus der Datei. Falls etwas nicht passt, kannst du die heruntergeladene Sicherheitskopie jederzeit wieder importieren.`,
      async ()=>{
        exportData('vor-import');
        state = { plants: parsed.plants, cuttings: parsed.cuttings, wishlist: importedWishlist };
        await saveState();
        clearSelection();
        render();
      },
      { title: 'Backup importieren?', confirmLabel: 'Sichern & Importieren' }
    );
    inputEl.value = '';
  };
  reader.readAsText(file);
}

/* ---------- Export ---------- */

function exportData(filenameSuffix){
  const dataStr = JSON.stringify(state, null, 2);
  const blob = new Blob([dataStr], {type:'application/json'});
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  const dateStr = new Date().toISOString().slice(0,10);
  const suffix = filenameSuffix ? `-${filenameSuffix}` : '';
  a.href = url;
  a.download = `pflanzenkatalog-backup-${dateStr}${suffix}.json`;
  document.body.appendChild(a);
  a.click();
  document.body.removeChild(a);
  URL.revokeObjectURL(url);
}

function buildHeaderStats(){
  const all = [...state.plants, ...state.cuttings];
  const reservoirsDue = all.filter(x=>{ const i = getRefillInfo(x); return i && i.overdue; }).length;
  const fertDue = all.filter(x=>{ const i = getFertilizerInfo(x); return i && i.overdue; }).length;
  const flushDue = all.filter(x=>{ const i = getFlushInfo(x); return i && i.overdue; }).length;
  const parts = [`${state.plants.length} Pflanze${state.plants.length===1?'':'n'}`, `${state.cuttings.length} Ableger/Stecklinge`];
  if(reservoirsDue>0) parts.push(`${reservoirsDue} Reservoir${reservoirsDue===1?'':'s'} fällig`);
  if(fertDue>0) parts.push(`${fertDue} zum Düngen`);
  if(flushDue>0) parts.push(`${flushDue} zum Durchspülen`);
  return parts.join(' · ');
}

// Firestore begrenzt ein einzelnes Dokument auf 1 MiB (1.048.576 Byte). Da dieser
// Katalog seinen kompletten Bestand als EIN Dokument speichert (siehe docRef weiter
// oben), warnen wir rechtzeitig, bevor Speichern fehlschlägt — mit konkretem
// Hinweis, dass alte Protokoll-Einträge sich jetzt einzeln löschen lassen.
const FIRESTORE_DOC_LIMIT_BYTES = 1048576;
const STORAGE_WARN_RATIO = 0.7;
const STORAGE_DANGER_RATIO = 0.9;

function getStateSizeBytes(){
  return new TextEncoder().encode(JSON.stringify(state)).length;
}

function renderStorageWarning(){
  const container = document.getElementById('storageWarning');
  if(!container) return;
  const bytes = getStateSizeBytes();
  const ratio = bytes / FIRESTORE_DOC_LIMIT_BYTES;
  if(ratio < STORAGE_WARN_RATIO){
    container.innerHTML = '';
    return;
  }
  const kb = Math.round(bytes/1024);
  const limitKb = Math.round(FIRESTORE_DOC_LIMIT_BYTES/1024);
  const level = ratio >= STORAGE_DANGER_RATIO ? 'kritisch nah an' : 'nähert sich';
  container.innerHTML = `
    <div class="storage-warning">
      <p><strong>Speicherplatz ${level} dem Limit:</strong> dein Bestand ist ${kb} KB von ${limitKb} KB groß — Firestore erlaubt maximal 1 Dokument pro Nutzer:in mit dieser Größe. Lösche alte Protokoll-Einträge (✕-Button bei Düngen/Gießen/Durchspülen) oder exportiere und räume deinen Bestand auf, sonst schlägt das Speichern bald fehl.</p>
    </div>`;
}

function renderDailyOverview(){
  const container = document.getElementById('dailyOverview');
  const water = [];
  const fert = [];
  const flush = [];
  state.plants.forEach(p=>{
    const info = getRefillInfo(p);
    if(info && info.overdue) water.push({type:'plants', id:p.id, name:p.name});
    const finfo = getFertilizerInfo(p);
    if(finfo && finfo.overdue) fert.push({type:'plants', id:p.id, name:p.name});
    const flinfo = getFlushInfo(p);
    if(flinfo && flinfo.overdue) flush.push({type:'plants', id:p.id, name:p.name});
  });
  state.cuttings.forEach(c=>{
    const info = getRefillInfo(c);
    if(info && info.overdue) water.push({type:'cuttings', id:c.id, name:c.name});
    const finfo = getFertilizerInfo(c);
    if(finfo && finfo.overdue) fert.push({type:'cuttings', id:c.id, name:c.name});
    const flinfo = getFlushInfo(c);
    if(flinfo && flinfo.overdue) flush.push({type:'cuttings', id:c.id, name:c.name});
  });

  if(water.length===0 && fert.length===0 && flush.length===0){
    container.innerHTML = '';
    return;
  }

  let html = '';
  if(water.length){
    html += `
      <div class="daily-banner">
        <span class="icon">💧</span>
        <div>
          <p class="title">${water.length} Reservoir${water.length===1?'':'s'} heute auffüllen</p>
          <div class="items">
            ${water.map(d=>`<span class="daily-chip" onclick="jumpTo('${d.type}', ${d.id})">${escapeHtml(d.name)}</span>`).join('')}
          </div>
        </div>
      </div>`;
  }
  if(fert.length){
    html += `
      <div class="daily-banner">
        <span class="icon">🌿</span>
        <div>
          <p class="title">${fert.length} Pflanze${fert.length===1?'':'n'} heute düngen</p>
          <div class="items">
            ${fert.map(d=>`<span class="daily-chip" onclick="jumpTo('${d.type}', ${d.id})">${escapeHtml(d.name)}</span>`).join('')}
          </div>
        </div>
      </div>`;
  }
  if(flush.length){
    html += `
      <div class="daily-banner">
        <span class="icon">🚿</span>
        <div>
          <p class="title">${flush.length} Substrat${flush.length===1?'':'e'} heute durchspülen</p>
          <div class="items">
            ${flush.map(d=>`<span class="daily-chip" onclick="jumpTo('${d.type}', ${d.id})">${escapeHtml(d.name)}</span>`).join('')}
          </div>
        </div>
      </div>`;
  }
  container.innerHTML = html;
}

function populateCategoryFilter(){
  const select = document.getElementById('filterCategory');
  const current = select.value;
  const categories = [...new Set(state.plants.map(p=>p.category).filter(Boolean))].sort();
  select.innerHTML = `<option value="">Alle Kategorien</option>` + categories.map(c=>`<option value="${escapeHtml(c)}" ${c===current?'selected':''}>${escapeHtml(c)}</option>`).join('');
}

function sortItems(items, sortBy){
  const sorted = [...items];
  if(sortBy==='name-asc') sorted.sort((a,b)=>(a.name||'').localeCompare(b.name||'','de'));
  else if(sortBy==='name-desc') sorted.sort((a,b)=>(b.name||'').localeCompare(a.name||'','de'));
  else if(sortBy==='status') sorted.sort((a,b)=>(a.status||'').localeCompare(b.status||'','de'));
  else if(sortBy==='location') sorted.sort((a,b)=>(a.location||'').localeCompare(b.location||'','de'));
  return sorted;
}

function render(){
  renderStorageWarning();
  renderDailyOverview();
  populateCategoryFilter();
  const q = document.getElementById('searchInput').value.toLowerCase();
  const statusFilter = document.getElementById('filterStatus').value;
  const categoryFilter = document.getElementById('filterCategory').value;
  const originFilter = document.getElementById('filterOrigin').value;
  const priorityFilter = document.getElementById('filterPriority').value;
  const sortBy = document.getElementById('sortBy').value;
  document.getElementById('tabCountPlants').textContent = state.plants.length ? `(${state.plants.length})` : '';
  document.getElementById('tabCountCuttings').textContent = state.cuttings.length ? `(${state.cuttings.length})` : '';
  document.getElementById('tabCountWishlist').textContent = state.wishlist.length ? `(${state.wishlist.length})` : '';
  document.getElementById('headerCount').textContent = buildHeaderStats();
  updateBulkBar();

  const content = document.getElementById('content');
  if(currentTab==='plants'){
    let items = state.plants.filter(p => !q || (p.name+p.latin+p.category+p.location).toLowerCase().includes(q));
    if(statusFilter) items = items.filter(p => p.status === statusFilter);
    if(categoryFilter) items = items.filter(p => p.category === categoryFilter);
    items = sortItems(items, sortBy);
    if(items.length===0){
      content.innerHTML = emptyState(state.plants.length===0 ? 'Noch keine Pflanzen' : 'Keine Treffer', state.plants.length===0 ? 'Füge deine erste Pflanze hinzu, um loszulegen.' : 'Versuch andere Filter oder Suchbegriffe.', state.plants.length===0 ? '🌱' : '🔍');
      return;
    }
    content.innerHTML = currentView==='grid'
      ? `<div class="grid">${items.map(plantCard).join('')}</div>`
      : items.map(plantListRow).join('');
  } else if(currentTab==='cuttings'){
    let items = state.cuttings.filter(c => !q || (c.name+c.type+(c.foreignSource||'')+c.location).toLowerCase().includes(q));
    if(statusFilter) items = items.filter(c => c.status === statusFilter);
    if(originFilter) items = items.filter(c => c.origin === originFilter);
    if(filterParentType!=null && filterParentId!=null){
      const descendantIds = getAllDescendantIds(filterParentType, filterParentId);
      items = items.filter(c => descendantIds.has(c.id));
    }
    items = sortItems(items, sortBy);
    content.innerHTML = '';
    if(filterParentType!=null && filterParentId!=null){
      const parentName = filterParentType==='cutting' ? (getCuttingById(filterParentId)||{}).name : getPlantName(filterParentId);
      content.innerHTML += `<div class="hint" style="display:flex;justify-content:space-between;align-items:center;">
          <span>Zeigt alle Ableger (inkl. Nachkommen) von <strong>${escapeHtml(parentName||'')}</strong></span>
          <button class="btn ghost" style="padding:5px 10px;font-size:12.5px;" onclick="resetParentFilter()">Filter aufheben</button>
        </div>`;
    }
    if(items.length===0){
      content.innerHTML += emptyState(state.cuttings.length===0 ? 'Noch keine Ableger' : 'Keine Treffer', state.cuttings.length===0 ? 'Erfasse Ableger, Stecklinge oder Sämlinge und verlinke sie mit deinen Pflanzen.' : 'Versuch andere Filter oder Suchbegriffe.', state.cuttings.length===0 ? '🌿' : '🔍');
      return;
    }
    content.innerHTML += currentView==='grid'
      ? `<div class="grid">${items.map(cuttingCard).join('')}</div>`
      : items.map(cuttingListRow).join('');
  } else {
    let items = state.wishlist.filter(w => !q || (w.name+(w.latin||'')+(w.category||'')+(w.source||'')+(w.notes||'')).toLowerCase().includes(q));
    if(priorityFilter) items = items.filter(w => w.status === priorityFilter);
    items = sortItems(items, sortBy);
    if(items.length===0){
      content.innerHTML = emptyState(state.wishlist.length===0 ? 'Noch nichts auf der Wunschliste' : 'Keine Treffer', state.wishlist.length===0 ? 'Trag Pflanzen ein, die du dir für später vormerkst.' : 'Versuch andere Filter oder Suchbegriffe.', state.wishlist.length===0 ? '⭐' : '🔍');
      return;
    }
    content.innerHTML = currentView==='grid'
      ? `<div class="grid">${items.map(wishlistCard).join('')}</div>`
      : items.map(wishlistListRow).join('');
  }
}

function getPlantName(id){
  const p = state.plants.find(x=>x.id===id);
  return p ? p.name : null;
}

function getCuttingById(id){
  return state.cuttings.find(x=>x.id===id) || null;
}

// Direkte Kinder eines Elternteils. parentType: 'plant' | 'cutting'
function getDirectChildren(parentType, parentId){
  return state.cuttings.filter(c => c.origin==='eigene'
    && (c.parentType || 'plant') === parentType
    && (parentType==='plant' ? c.ownPlantId===parentId : c.parentCuttingId===parentId));
}

// Zählt Ableger + Ableger von Ablegern usw. (rekursiv).
// visited schützt vor Endlosschleifen bei zyklischen Referenzen in den Daten
// (z. B. durch eine von Hand bearbeitete oder beschädigte Import-Datei).
function getDescendantCount(parentType, parentId, visited){
  visited = visited || new Set();
  const key = parentType+':'+parentId;
  if(visited.has(key)) return 0;
  visited.add(key);
  const direct = getDirectChildren(parentType, parentId);
  let count = direct.length;
  direct.forEach(child => { count += getDescendantCount('cutting', child.id, visited); });
  return count;
}

// Verhindert, dass ein Ableger sich selbst oder einen eigenen Nachkommen als Elternteil bekommt
function isSelfOrDescendant(cuttingId, candidateCuttingId, visited){
  visited = visited || new Set();
  if(cuttingId===candidateCuttingId) return true;
  if(visited.has(cuttingId)) return false;
  visited.add(cuttingId);
  const children = getDirectChildren('cutting', cuttingId);
  return children.some(child => isSelfOrDescendant(child.id, candidateCuttingId, visited));
}

// Alle Nachkommen (direkt + verschachtelt) eines Elternteils als Id-Set
function getAllDescendantIds(parentType, parentId, visited){
  visited = visited || new Set();
  const key = parentType+':'+parentId;
  const ids = new Set();
  if(visited.has(key)) return ids;
  visited.add(key);
  const direct = getDirectChildren(parentType, parentId);
  direct.forEach(child=>{
    ids.add(child.id);
    getAllDescendantIds('cutting', child.id, visited).forEach(id=>ids.add(id));
  });
  return ids;
}

function getParentLabel(item){
  if(item.origin!=='eigene') return item.foreignSource || 'fremd';
  if((item.parentType||'plant')==='cutting'){
    const parent = getCuttingById(item.parentCuttingId);
    return parent ? parent.name : '—';
  }
  return getPlantName(item.ownPlantId) || '—';
}

function escapeHtml(s){
  return String(s==null?'':s).replace(/[&<>"']/g, m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
}

/* ---------- Modal ---------- */

function openModal(type, id, prefill){
  const tab = type || currentTab;
  editingId = id || null;
  const overlay = document.getElementById('overlay');
  const box = document.getElementById('modalBox');
  overlay.classList.add('show');

  if(tab==='plants'){
    const p = editingId ? state.plants.find(x=>x.id===editingId) : (prefill || {});
    box.innerHTML = plantForm(p||{});
    initFormDynamicState('f', p||{});
  } else if(tab==='cuttings'){
    const c = editingId ? state.cuttings.find(x=>x.id===editingId) : (prefill || {});
    box.innerHTML = cuttingForm(c||{});
    updateOwnPlantVisibility((c&&c.origin) || 'eigene');
    initFormDynamicState('c', c||{});
  } else {
    const w = editingId ? state.wishlist.find(x=>x.id===editingId) : (prefill || {});
    box.innerHTML = wishlistForm(w||{});
  }
  document.getElementById('overlay').onclick = (e)=>{ if(e.target.id==='overlay') closeModal(); };
}

function closeModal(){
  document.getElementById('overlay').classList.remove('show');
  editingId = null;
  convertingWishlistId = null;
}

  }
}

async function saveWishlistItem(){
  const name = document.getElementById('w_name').value.trim();
  if(!name){
    document.getElementById('err_w_name').classList.add('show');
    return;
  }
  document.getElementById('err_w_name').classList.remove('show');

  const existing = editingId ? (state.wishlist.find(x=>x.id===editingId)||{}) : {};
  const data = {
    name,
    latin: document.getElementById('w_latin').value.trim(),
    category: document.getElementById('w_category').value.trim(),
    status: document.getElementById('w_status').value,
    price: document.getElementById('w_price').value.trim(),
    source: document.getElementById('w_source').value.trim(),
    link: document.getElementById('w_link').value.trim(),
    notes: document.getElementById('w_notes').value.trim(),
    addedDate: existing.addedDate || new Date().toISOString().slice(0,10),
  };

  let savedId;
  if(editingId){
    const idx = state.wishlist.findIndex(x=>x.id===editingId);
    state.wishlist[idx] = {...state.wishlist[idx], ...data};
    savedId = editingId;
  } else {
    data.id = nextId(state.wishlist);
    state.wishlist.push(data);
    savedId = data.id;
  }
  await saveState();
  closeModal();
  render();

  if(data.status === 'Gekauft'){
    showConfirm(
      `"${name}" ist als gekauft markiert. Jetzt direkt als neue Pflanze im Katalog anlegen? Der Wunschlisten-Eintrag bleibt bestehen, bis du die neue Pflanze speicherst.`,
      ()=> convertWishlistItemToPlant(savedId),
      { title: 'In den Katalog übernehmen?', confirmLabel: 'Ja, Pflanze anlegen' }
    );
  }
}

// Öffnet das "Neue Pflanze"-Formular, vorausgefüllt mit den Wunschlisten-Daten.
// Der Wunschlisten-Eintrag wird erst gelöscht, wenn die neue Pflanze tatsächlich
// gespeichert wird (siehe savePlant) — bricht der Nutzer ab, bleibt er erhalten.
function convertWishlistItemToPlant(id){
  const item = state.wishlist.find(x=>x.id===id);
  if(!item) return;
  const noteParts = [];
  if(item.source) noteParts.push(`Quelle: ${item.source}`);
  if(item.price) noteParts.push(`Preis: ${item.price}`);
  if(item.link) noteParts.push(`Link: ${item.link}`);
  if(item.notes) noteParts.push(item.notes);
  convertingWishlistId = id;
  openModal('plants', null, {
    name: item.name,
    latin: item.latin,
    category: item.category,
    notes: noteParts.join(' — '),
  });
}

async function bulkMarkPurchased(){
  if(selectedIds.size===0) return;
  state.wishlist.forEach(item=>{
    if(selectedIds.has(item.id)){
      item.status = 'Gekauft';
    }
  });
  await saveState();
  clearSelection();
  render();
}

function updateOwnPlantVisibility(origin){
  const optEigene = document.getElementById('opt_eigene');
  const optFremd = document.getElementById('opt_fremd');
  if(optEigene && optFremd){
    optEigene.classList.toggle('active', origin==='eigene');
    optFremd.classList.toggle('active', origin==='fremd');
    optFremd.classList.toggle('clay', origin==='fremd');
    optEigene.dataset.origin = origin;
  }
  const fieldOwn = document.getElementById('field_own');
  const fieldForeign = document.getElementById('field_foreign');
  if(fieldOwn && fieldForeign){
    fieldOwn.style.display = origin==='eigene' ? 'block' : 'none';
    fieldForeign.style.display = origin==='fremd' ? 'block' : 'none';
  }
  const nameLabel = document.getElementById('c_name_label');
  const nameInput = document.getElementById('c_name');
  if(nameLabel && nameInput){
    if(origin==='eigene'){
      nameLabel.textContent = 'Bezeichnung (optional)';
      nameInput.placeholder = 'z. B. Ableger #1, Fensterbank-Ableger';
    } else {
      nameLabel.textContent = 'Name';

function getSubstrateValue(prefix){
  const select = document.getElementById(prefix+'_substrate_select');
  const custom = document.getElementById(prefix+'_substrate_custom');
  if(!select) return '';
  if(select.value === 'Sonstiges') return (custom.value||'').trim();
  return select.value;
}

function onSubstrateChange(prefix){
  const select = document.getElementById(prefix+'_substrate_select');
  const custom = document.getElementById(prefix+'_substrate_custom');
  const reservoirBlock = document.getElementById(prefix+'_reservoir_block');
  custom.style.display = select.value === 'Sonstiges' ? 'block' : 'none';
  if(reservoirBlock){
    reservoirBlock.style.display = isSemiHydro(select.value) ? 'block' : 'none';
  }
  updateCareTips(prefix);
}

// Wird nur ausgelöst, wenn der Nutzer das Substrat-Dropdown tatsächlich ändert
// (nicht beim programmatischen Aufruf von onSubstrateChange() beim Öffnen des Formulars)
// -> übernimmt das alte Substrat automatisch als "Substrat vorher" und setzt das
// Umstellungsdatum bequem auf heute. Beides bleibt manuell überschreibbar.
function onSubstrateSelectChanged(prefix){
  const select = document.getElementById(prefix+'_substrate_select');
  const prevValue = select.dataset.prev || '';
  onSubstrateChange(prefix);
  const beforeInput = document.getElementById(prefix+'_substrateBefore');
  const dateInput = document.getElementById(prefix+'_substrateChangedDate');
  if(prevValue && select.value !== prevValue){
    if(beforeInput) beforeInput.value = prevValue;
    if(dateInput) dateInput.value = new Date().toISOString().slice(0,10);
  }
  select.dataset.prev = select.value;
  updateSubstrateSinceHint(prefix);
}

function setReservoirEmpty(prefix, isEmpty){
  const yesBtn = document.getElementById(prefix+'_res_yes');
  const noBtn = document.getElementById(prefix+'_res_no');
  const emptySinceField = document.getElementById(prefix+'_emptySince_field');
  yesBtn.classList.toggle('active', isEmpty);
  yesBtn.classList.toggle('clay', isEmpty);
  noBtn.classList.toggle('active', !isEmpty);
  emptySinceField.style.display = isEmpty ? 'block' : 'none';
  if(isEmpty){
    const dateInput = document.getElementById(prefix+'_emptySince');
    if(!dateInput.value){ dateInput.value = new Date().toISOString().slice(0,10); }
  }
  window['_'+prefix+'_reservoirEmpty'] = isEmpty;
}

function getCuttingSpeciesName(){
  const origin = window._currentOrigin || 'eigene';
  if(origin==='eigene'){
    const ownSelect = document.getElementById('c_ownPlant');
    if(ownSelect && ownSelect.value){
      const [kind, idStr] = ownSelect.value.split(':');
      const id = parseInt(idStr);
      if(kind==='c'){
        const cutting = getCuttingById(id);
        return cutting ? cutting.name : '';
      }
      const plant = state.plants.find(p=>p.id===id);
      return plant ? plant.name : '';
    }
    return '';
  }
  const nameField = document.getElementById('c_name');
  return nameField ? nameField.value : '';
}

function updateCareTips(prefix){
  const speciesName = prefix==='f'
    ? (document.getElementById('f_name') ? document.getElementById('f_name').value : '')
    : getCuttingSpeciesName();
  const substrate = getSubstrateValue(prefix);
  const tips = getCareTips(speciesName, substrate);
  const box = document.getElementById(prefix+'_careTips');
  if(!box) return;
  if(tips.length===0){
    box.style.display = 'none';
    box.innerHTML = '';
  } else {
    box.style.display = 'block';
    box.innerHTML = tips.map(t=>`<div style="margin-bottom:6px;">${escapeHtml(t)}</div>`).join('');
  }
}

function updateSubstrateSinceHint(prefix){
  const dateInput = document.getElementById(prefix+'_substrateChangedDate');
  const hint = document.getElementById(prefix+'_substrateSinceHint');
  if(!dateInput || !hint) return;
  if(!dateInput.value){ hint.style.display='none'; hint.innerHTML=''; return; }
  const changed = new Date(dateInput.value + 'T00:00:00');
  const today = new Date(new Date().toDateString());
  const days = Math.max(0, Math.round((today.getTime()-changed.getTime())/(24*60*60*1000)));
  hint.style.display = 'block';
  hint.innerHTML = `Seit <strong>${days} Tag${days===1?'':'en'}</strong> im aktuellen Substrat — relevant für die Beobachtung von Anpassungsproblemen oder Wurzelfäule.`;
}

function initFormDynamicState(prefix, item){
  onSubstrateChange(prefix);
  const reservoirBlock = document.getElementById(prefix+'_reservoir_block');
  if(reservoirBlock){
    window['_'+prefix+'_reservoirEmpty'] = !!item.reservoirEmpty;
  }
  updateSubstrateSinceHint(prefix);
}
function onPlantNameInput(){

async function savePlant(){
  const name = document.getElementById('f_name').value.trim();
  if(!name){ document.getElementById('err_name').classList.add('show'); return; }
  document.getElementById('err_name').classList.remove('show');

  const substrate = getSubstrateValue('f');
  const reservoirEmpty = !!window['_f_reservoirEmpty'];
  const fertilizerIntervalDays = parseInt(document.getElementById('f_fertInterval').value) || 0;
  const existingPlant = editingId ? (state.plants.find(x=>x.id===editingId)||{}) : {};
  const existingLog = existingPlant.fertilizerLog || [];
  const fertDate = document.getElementById('f_fertDate').value;
  const fertilizerLog = fertDate
    ? [...existingLog, { date: fertDate, product: document.getElementById('f_fertProduct').value.trim() || 'Canna Vega', note: document.getElementById('f_fertNote').value.trim() }]
    : existingLog;
  const existingWaterLog = existingPlant.wateringLog || [];
  const waterDate = document.getElementById('f_waterDate').value;
  const wateringLog = waterDate
    ? [...existingWaterLog, { date: waterDate, type: document.getElementById('f_waterType').value, note: document.getElementById('f_waterNote').value.trim() }]
    : existingWaterLog;
  const flushIntervalDays = parseInt(document.getElementById('f_flushInterval').value) || 0;
  const existingFlushLog = existingPlant.flushLog || [];
  const flushDate = document.getElementById('f_flushDate').value;
  const flushLog = flushDate
    ? [...existingFlushLog, { date: flushDate, note: document.getElementById('f_flushNote').value.trim() }]
    : existingFlushLog;

  const data = {
    name,
    latin: document.getElementById('f_latin').value.trim(),
    category: document.getElementById('f_category').value.trim(),
    acquired: document.getElementById('f_acquired').value,
    location: document.getElementById('f_location').value.trim(),
    substrate,
    substrateBefore: document.getElementById('f_substrateBefore').value.trim(),
    substrateChangedDate: document.getElementById('f_substrateChangedDate').value,
    watering: document.getElementById('f_watering').value.trim(),
    repotted: document.getElementById('f_repotted').value.trim(),
    status: document.getElementById('f_status').value,
    notes: document.getElementById('f_notes').value.trim(),
    reservoirEmpty: isSemiHydro(substrate) ? reservoirEmpty : false,
    reservoirEmptySince: isSemiHydro(substrate) && reservoirEmpty ? document.getElementById('f_emptySince').value : '',
    dryDays: isSemiHydro(substrate) ? (parseInt(document.getElementById('f_dryDays').value) || 0) : null,
    fertilizerIntervalDays,
    fertilizerLog,
    wateringLog,
    flushIntervalDays,
    flushLog,
  };

  if(editingId){
    const idx = state.plants.findIndex(x=>x.id===editingId);
    state.plants[idx] = {...state.plants[idx], ...data};
  } else {
    data.id = nextId(state.plants);
    state.plants.push(data);
    // Falls diese Pflanze aus der Wunschliste heraus angelegt wurde ("Gekauft" ->
    // "In Katalog übernehmen"), verschwindet der Wunschlisten-Eintrag jetzt, wo die
    // Pflanze tatsächlich gespeichert wurde (nicht schon beim bloßen Öffnen des Formulars).
    if(convertingWishlistId != null){
      state.wishlist = state.wishlist.filter(x=>x.id!==convertingWishlistId);
      convertingWishlistId = null;
    }
  }
  await saveState();
  closeModal();
  render();
}

async function saveCutting(){
  const origin = window._currentOrigin || 'eigene';
  const ownSelect = document.getElementById('c_ownPlant');
  const label = document.getElementById('c_name').value.trim();

  let name;
  let parentType = 'plant';
  let ownPlantId = null;
  let parentCuttingId = null;
  if(origin==='eigene'){
    const raw = ownSelect ? ownSelect.value : '';
    const [kind, idStr] = raw.split(':');
    const id = parseInt(idStr);
    let parent = null;
    if(kind==='c'){
      parentType = 'cutting';
      parentCuttingId = id;
      parent = getCuttingById(id);
    } else {
      parentType = 'plant';
      ownPlantId = id;
      parent = state.plants.find(p=>p.id===id);
    }
    if(!parent){ document.getElementById('err_c_name').textContent = 'Bitte zuerst eine Pflanze oder einen Ableger im Bestand anlegen.'; document.getElementById('err_c_name').classList.add('show'); return; }
    name = label ? `${parent.name} – ${label}` : parent.name;
  } else {
    if(!label){ document.getElementById('err_c_name').textContent = 'Bitte einen Namen eingeben.'; document.getElementById('err_c_name').classList.add('show'); return; }
    name = label;
  }
  document.getElementById('err_c_name').classList.remove('show');

  const substrate = getSubstrateValue('c');
  const reservoirEmpty = !!window['_c_reservoirEmpty'];
  const fertilizerIntervalDays = parseInt(document.getElementById('c_fertInterval').value) || 0;
  const existingCutting = editingId ? (state.cuttings.find(x=>x.id===editingId)||{}) : {};
  const existingLog = existingCutting.fertilizerLog || [];
  const fertDate = document.getElementById('c_fertDate').value;
  const fertilizerLog = fertDate
    ? [...existingLog, { date: fertDate, product: document.getElementById('c_fertProduct').value.trim() || 'Canna Vega', note: document.getElementById('c_fertNote').value.trim() }]
    : existingLog;
  const existingWaterLog = existingCutting.wateringLog || [];
  const waterDate = document.getElementById('c_waterDate').value;
  const wateringLog = waterDate
    ? [...existingWaterLog, { date: waterDate, type: document.getElementById('c_waterType').value, note: document.getElementById('c_waterNote').value.trim() }]
    : existingWaterLog;
  const flushIntervalDays = parseInt(document.getElementById('c_flushInterval').value) || 0;
  const existingFlushLog = existingCutting.flushLog || [];
  const flushDate = document.getElementById('c_flushDate').value;
  const flushLog = flushDate
    ? [...existingFlushLog, { date: flushDate, note: document.getElementById('c_flushNote').value.trim() }]
    : existingFlushLog;

  const data = {
    name,
    type: document.getElementById('c_type').value,
    dateTaken: document.getElementById('c_date').value,
    origin,
    parentType: origin==='eigene' ? parentType : null,
    ownPlantId: origin==='eigene' ? ownPlantId : null,
    parentCuttingId: origin==='eigene' ? parentCuttingId : null,
    foreignSource: origin==='fremd' ? document.getElementById('c_foreign').value.trim() : '',
    location: document.getElementById('c_location').value.trim(),
    substrate,
    substrateBefore: document.getElementById('c_substrateBefore').value.trim(),
    substrateChangedDate: document.getElementById('c_substrateChangedDate').value,
    watering: document.getElementById('c_watering').value.trim(),
    status: document.getElementById('c_status').value,
    notes: document.getElementById('c_notes').value.trim(),
    reservoirEmpty: isSemiHydro(substrate) ? reservoirEmpty : false,
    reservoirEmptySince: isSemiHydro(substrate) && reservoirEmpty ? document.getElementById('c_emptySince').value : '',
    dryDays: isSemiHydro(substrate) ? (parseInt(document.getElementById('c_dryDays').value) || 0) : null,
    fertilizerIntervalDays,
    fertilizerLog,
    wateringLog,
    flushIntervalDays,
    flushLog,
  };

  if(editingId){
    const idx = state.cuttings.findIndex(x=>x.id===editingId);
    state.cuttings[idx] = {...state.cuttings[idx], ...data};
  } else {
    data.id = nextId(state.cuttings);
    state.cuttings.push(data);
  }
  await saveState();
  closeModal();
  render();
}

let pendingDeleteAction = null;

function showConfirm(message, onConfirm, opts){
  const options = opts || {};
  document.getElementById('confirmTitle').textContent = options.title || 'Wirklich löschen?';
  document.getElementById('confirmDeleteBtn').textContent = options.confirmLabel || 'Löschen';
  document.getElementById('confirmMessage').textContent = message;
  pendingDeleteAction = onConfirm;
  document.getElementById('confirmOverlay').classList.add('show');
  document.getElementById('confirmOverlay').onclick = (e)=>{ if(e.target.id==='confirmOverlay') closeConfirm(); };
}

function closeConfirm(){
  document.getElementById('confirmOverlay').classList.remove('show');
  document.getElementById('confirmTitle').textContent = 'Wirklich löschen?';
  document.getElementById('confirmDeleteBtn').textContent = 'Löschen';
  pendingDeleteAction = null;
}

async function runPendingDelete(){
  const action = pendingDeleteAction;
  pendingDeleteAction = null;
  document.getElementById('confirmOverlay').classList.remove('show');
  if(action){ await action(); }
}

function deleteItem(type, id){
  const item = state[type].find(x=>x.id===id);
  const label = item ? item.name : 'diesen Eintrag';
  // Nur Pflanzen/Ableger können Ableger-Nachkommen haben; die Wunschliste ist ein
  // eigener Id-Raum, daher hier NICHT getDescendantCount mit einer id aus der
  // Wunschliste in state.cuttings suchen lassen (sonst falsche Zufallstreffer).
  let warning = '';
  if(type==='plants' || type==='cuttings'){
    const parentType = type==='plants' ? 'plant' : 'cutting';
    const childCount = getDescendantCount(parentType, id);
    if(childCount>0){
      warning = ` Achtung: ${childCount} damit verknüpfte Ableger/Stecklinge bleiben danach ohne Elternteil bestehen (sie werden nicht mit gelöscht).`;
    }
  }
  showConfirm(`"${label}" wird endgültig gelöscht. Diese Aktion kann nicht rückgängig gemacht werden.${warning}`, async ()=>{
    state[type] = state[type].filter(x=>x.id!==id);
    await saveState();
    closeModal();
    render();
  });
}

const LOG_CONTAINER_SUFFIX = {
  fertilizerLog: '_fertLogContainer',
  wateringLog: '_waterLogContainer',
  flushLog: '_flushLogContainer',
};

// Löscht einen einzelnen Eintrag aus einem Protokoll (Düngen/Gießen/Durchspülen),
// ohne das gerade offene Bearbeitungs-Formular zu schließen oder andere,
// noch nicht gespeicherte Feldänderungen darin zu verwerfen.
function deleteLogEntry(type, itemId, fieldName, index, prefix){
  showConfirm('Dieser Protokoll-Eintrag wird endgültig gelöscht.', async ()=>{
    const item = state[type].find(x=>x.id===itemId);
    if(!item || !Array.isArray(item[fieldName])) return;
    item[fieldName].splice(index, 1);
    await saveState();
    const containerId = prefix + LOG_CONTAINER_SUFFIX[fieldName];
    const container = document.getElementById(containerId);
    if(container){
      container.innerHTML = logHistoryHtml(item[fieldName], type, itemId, prefix, fieldName);
    }
    render();
  }, { title: 'Eintrag löschen?', confirmLabel: 'Löschen' });
}

document.addEventListener('keydown', (e)=>{
  if(e.key==='Escape'){
    closeConfirm();
    closeModal();

});
